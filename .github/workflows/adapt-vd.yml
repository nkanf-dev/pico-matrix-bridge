name: Adapt new VD builds

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without committing or publishing
        type: boolean
        default: true
      recheck_current:
        description: Download and revalidate the current build once
        type: boolean
        default: false
      force_agent:
        description: Exercise OMP even when deterministic checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vd-continuous-adaptation
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main' && github.repository == 'nkanf-dev/pico-matrix-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vd-adaptation
    permissions:
      contents: read
      actions: read
    outputs:
      state: ${{ steps.watch.outputs.state }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pico-store-lab==0.2.0
      - name: Observe official download metadata
        id: watch
        env:
          PICO_AUTH_JSON: ${{ secrets.PICO_AUTH_JSON }}
          GH_TOKEN: ${{ github.token }}
          RECHECK: ${{ inputs.recheck_current }}
        run: |
          args=()
          if [[ "$RECHECK" == true ]]; then args+=(--recheck); fi
          python scripts/adaptation/watch.py --output "$RUNNER_TEMP/vd-watch" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.watch.outputs.state == 'unchanged'
        with:
          name: vd-candidate
          path: ${{ runner.temp }}/vd-watch/report.json
          retention-days: 14
      - name: Show observation
        env:
          STATE: ${{ steps.watch.outputs.state }}
        run: echo "VD observation — $STATE" >> "$GITHUB_STEP_SUMMARY"

  analyze:
    needs: observe
    if: needs.observe.outputs.state == 'pending'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: vd-adaptation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned analysis tools
        run: |
          python -m pip install -r scripts/adaptation/requirements.txt
          npm ci --ignore-scripts --prefix scripts/adaptation/runtime
          scripts/adaptation/runtime/node_modules/.bin/omp --version
          echo "$PWD/scripts/adaptation/runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check trusted code
        run: |
          python -m unittest discover -s scripts/tests -p test_adaptation.py -v
          bun test scripts/adaptation/agent.test.ts
          ./gradlew --console=plain :tools:installDist :tools:test :profile-vd-code:test
      - name: Observe and validate
        env:
          PICO_AUTH_JSON: ${{ secrets.PICO_AUTH_JSON }}
          MIKUMIKU_API_KEY: ${{ secrets.MIKUMIKU_API_KEY }}
          FORCE_AGENT: ${{ inputs.force_agent }}
          RECHECK_CURRENT: ${{ inputs.recheck_current }}
        run: |
          args=()
          if [[ "$FORCE_AGENT" == true ]]; then args+=(--force-agent); fi
          if [[ "$RECHECK_CURRENT" == true ]]; then args+=(--recheck-current); fi
          python scripts/adaptation/run.py \
            --work "$RUNNER_TEMP/vd-analysis" --output "$RUNNER_TEMP/vd-result" "${args[@]}"
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'vd-result/report.json'
          if report.exists():
              data = json.loads(report.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## VD adaptation\n\n')
                  for field in ('state', 'failedStage', 'observedVersionCode', 'inputSha256', 'agentUsed', 'reason'):
                      if field in data:
                          out.write(f'- {field}: `{data[field]}`\n')
          PY
      - name: Keep compact evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vd-candidate
          path: |
            ${{ runner.temp }}/vd-result/report.json
            ${{ runner.temp }}/vd-result/source.json
            ${{ runner.temp }}/vd-result/recipe.json
            ${{ runner.temp }}/vd-result/baseline.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove sample and private process state
        if: always()
        run: rm -rf "$RUNNER_TEMP/vd-analysis"

  promote:
    needs: [observe, analyze]
    if: >-
      always() && needs.observe.result == 'success' &&
      (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') &&
      needs.observe.outputs.state != 'review-required' &&
      (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vd-candidate
          path: ${{ runner.temp }}/vd-result
      - name: Validate data boundary and dispatch isolated publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/adaptation/promote.py "$RUNNER_TEMP/vd-result"
