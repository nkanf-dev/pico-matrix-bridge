name: Source checks
on:
  pull_request:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Check adaptation boundaries
        run: |
          python -m pip install -r scripts/adaptation/requirements.txt
          npm ci --ignore-scripts --omit=optional --prefix scripts/adaptation/runtime
          bun test scripts/adaptation/agent.test.ts
      - run: ./scripts/verify.sh
