name: Publish signed profile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reviewed profile to sign and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: profile-publishing
    concurrency:
      group: profile-publishing-${{ inputs.profile }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check reviewed sources
        run: ./scripts/verify.sh
      - name: Sign profile with publisher key
        env:
          PROFILE_KEY: ${{ inputs.profile }}
          PICO_PROFILE_KEYSTORE_BASE64: ${{ secrets.PICO_PROFILE_KEYSTORE_BASE64 }}
          PICO_PROFILE_STORE_PASSWORD: ${{ secrets.PICO_PROFILE_STORE_PASSWORD }}
          PICO_PROFILE_KEY_PASSWORD: ${{ secrets.PICO_PROFILE_STORE_PASSWORD }}
          PICO_PROFILE_KEY_ALIAS: profile-publisher
        run: |
          set -euo pipefail
          test -n "$PICO_PROFILE_KEYSTORE_BASE64"
          test -n "$PICO_PROFILE_STORE_PASSWORD"
          export PICO_PROFILE_KEYSTORE="$RUNNER_TEMP/profile-publisher.p12"
          trap 'rm -f "$PICO_PROFILE_KEYSTORE"' EXIT
          printf '%s' "$PICO_PROFILE_KEYSTORE_BASE64" | base64 --decode > "$PICO_PROFILE_KEYSTORE"
          chmod 600 "$PICO_PROFILE_KEYSTORE"
          python3 scripts/build_profile.py --key "$PROFILE_KEY" --variant release --output "$RUNNER_TEMP/profile-build"
      - name: Verify artifact and prepare release
        id: release
        env:
          PROFILE_KEY: ${{ inputs.profile }}
        run: |
          python3 scripts/prepare_profile_release.py \
            --key "$PROFILE_KEY" \
            --apk "$RUNNER_TEMP/profile-build/matrix-profile-$PROFILE_KEY.apk" \
            --output "$RUNNER_TEMP/profile-release"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          NOTES: ${{ steps.release.outputs.notes }}
          CHECKSUMS: ${{ steps.release.outputs.checksums }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "$ASSET" "$CHECKSUMS" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES" --latest=false
      - name: Verify published asset digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published-release.json"
          python3 - "$RUNNER_TEMP/profile-release/receipt.json" "$RUNNER_TEMP/published-release.json" <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1]))
          release = json.load(open(sys.argv[2]))
          expected_name = 'matrix-profile-' + receipt['key'] + '.apk'
          assets = [asset for asset in release['assets'] if asset['name'] == expected_name]
          if (release['tag_name'] != receipt['tag'] or release['draft'] or release['prerelease'] or
              len(assets) != 1 or assets[0]['state'] != 'uploaded' or
              assets[0].get('digest') != 'sha256:' + receipt['sha256']):
              raise SystemExit('Published profile release does not match the signed artifact')
          PY
